name: CI

# The repo had no automated checks: a change could reach master with a failing
# suite, or with a module-level error that stopped the app from booting at all.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.1.3

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}

      # --no-root because the project is package-mode = false.
      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      # conftest.py seeds inert placeholders for the settings that Settings
      # validates at import time, so no real secret is needed here.
      - name: Run tests
        run: poetry run pytest -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pipx install poetry==2.1.3

      - run: poetry install --with dev --no-root --no-interaction

      # Import the app the way the server does. A broken import here is
      # invisible to unit tests that never touch app.main.
      - name: Import the application
        env:
          APP_ENV: local
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_JWT_SECRET: test-jwt-secret
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          CF_ACCOUNT_ID: test-account
          R2_ACCESS_KEY_ID: test-access-key
          R2_SECRET_ACCESS_KEY: test-secret-key
          R2_BUCKET: test-bucket
          CORS_ORIGINS: http://localhost:3000
        run: poetry run python -c "from app.main import create_app; create_app(); print('app builds')"
